name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  build-push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: build-test
    # Only publish images for pushes to master, not for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.sha-tag.outputs.image }}
      sha_tag: ${{ steps.sha-tag.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Output the exact SHA image reference so deploy jobs can pin it.
      - name: Output image SHA tag
        id: sha-tag
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${SHA_TAG}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Pinned image: $IMAGE"

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # 'dev' environment: no protection rules -> deploys automatically.
    environment:
      name: dev
      url: https://hello-world-latest-0rkk.onrender.com
    steps:
      - name: Trigger Render deploy (dev)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build-push-image.outputs.image }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set for the 'dev' environment."
            exit 1
          fi
          echo "Deploying pinned image: $IMAGE"
          HOOK_URL="${RENDER_DEPLOY_HOOK}&imgURL=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['IMAGE']))")"
          http_code=$(curl -s -o response.txt -w "%{http_code}" "$HOOK_URL")
          echo "Render responded with HTTP $http_code"
          cat response.txt || true
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render dev deploy hook failed (HTTP $http_code)"
            exit 1
          fi
          echo "Dev deploy triggered successfully (image: $IMAGE)"

  deploy-stg:
    name: Deploy to Stg
    runs-on: ubuntu-latest
    needs: [deploy-dev, build-push-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # 'stg' environment: required reviewer = manual approval gate.
    environment:
      name: stg
      url: https://hello-world-stg.onrender.com
    steps:
      - name: Trigger Render deploy (stg)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build-push-image.outputs.image }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set for the 'stg' environment."
            exit 1
          fi
          echo "Deploying pinned image: $IMAGE"
          HOOK_URL="${RENDER_DEPLOY_HOOK}&imgURL=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['IMAGE']))")"
          http_code=$(curl -s -o response.txt -w "%{http_code}" "$HOOK_URL")
          echo "Render responded with HTTP $http_code"
          cat response.txt || true
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Render stg deploy hook failed (HTTP $http_code)"
            exit 1
          fi
          echo "Stg deploy triggered successfully (image: $IMAGE)"
